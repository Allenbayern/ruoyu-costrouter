# Flat catalog v5 template: five exact routes; no fallback or variant semantics.
plugins:
  enabled:
    - ruoyu-cost-router
  entries:
    ruoyu-cost-router:
      catalog_version: 5
      llm:
        allow_provider_override: true
        allow_model_override: true
        allowed_providers: [custom:new-api]
        allowed_models: [deepseek-v4-flash, deepseek-v4-pro, gpt-5.6-sol]
      budget:
        max_cost_usd: 0.10
        max_tokens: 131072
        remaining_budget_usd: 1.00
      routes:
        flash:
          enabled: true
          provider: custom:new-api
          model: deepseek-v4-flash
          worker_profile: worker-flash
          pricing: {input_per_million_usd: 0, output_per_million_usd: 0}
          max_output_tokens: 65536
          budget_fallbacks: []
        luna:
          enabled: true
          provider: custom:new-api
          model: deepseek-v4-flash
          worker_profile: worker-luna
          pricing: {input_per_million_usd: 0, output_per_million_usd: 0}
          max_output_tokens: 12000
          budget_fallbacks: []
        terra:
          enabled: true
          provider: custom:new-api
          model: deepseek-v4-flash
          worker_profile: worker-terra
          pricing: {input_per_million_usd: 0, output_per_million_usd: 0}
          max_output_tokens: 12000
          budget_fallbacks: []
        terra_pro:
          enabled: true
          provider: custom:new-api
          model: deepseek-v4-pro
          worker_profile: worker-terra
          pricing: {input_per_million_usd: 0.435, output_per_million_usd: 0.87}
          max_output_tokens: 12000
          budget_fallbacks: []
        sol:
          enabled: true
          provider: custom:new-api
          model: gpt-5.6-sol
          worker_profile: worker-sol
          pricing: {input_per_million_usd: 0.9, output_per_million_usd: 4.05}
          max_output_tokens: 6000
          budget_fallbacks: []
      routing:
        keyword_fallback_enabled: false
        keyword_tiers: {}
