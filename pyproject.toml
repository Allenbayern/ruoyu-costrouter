[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruoyu-cost-router"
version = "0.4.0"
description = "Private controller-first budget-aware Hermes plugin"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
